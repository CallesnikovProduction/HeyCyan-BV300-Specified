name: Android audio emulator E2E

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-audio-e2e.yml
      - android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/ai/live/**
      - android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/ai/transcription/**
      - android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/plugins/handsfreetranslator/**
      - android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/plugins/meetingsparknotes/**
      - android/CyanBridge/app/src/androidTest/assets/audio/**
      - android/CyanBridge/app/src/androidTest/java/com/fersaiyan/cyanbridge/hil/audio/**
      - tools/hil/start_emulator_audio.sh
      - tools/hil/run_audio_emulator_ci.sh

permissions:
  contents: read
  packages: read

concurrency:
  group: audio-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-e2e:
    name: Audio fixtures (emulator, no glasses, hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Verify Meta SDK credential
        env:
          META_GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${META_GITHUB_TOKEN:-}" ] && [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "No GitHub token for Meta DAT packages"
            exit 1
          fi
          echo "META_GITHUB_TOKEN=${META_GITHUB_TOKEN:-$GITHUB_TOKEN}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${META_GITHUB_TOKEN:-$GITHUB_TOKEN}" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run audio harness on emulator (audio enabled)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          # Note: intentionally no -noaudio / -no-audio so AudioRecord + SpeechRecognizer surface.
          script: bash tools/hil/run_audio_emulator_ci.sh
        env:
          META_GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
